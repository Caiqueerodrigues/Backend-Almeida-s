name: "Deploy VPS"
on:
  push:
    branches: [develop]

jobs:
  build_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Docker Login
        uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASSWORD }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            caiqueerodrigues/almeidas:v1
            caiqueerodrigues/almeidas:latest
            caiqueerodrigues/almeidas:${{ github.sha }}

      - name: Criar .env na VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          script: |
            cat > /almeidas/.env <<EOF
            MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
            MYSQL_USER=${{ secrets.MYSQL_USER }}
            MYSQL_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            MYSQL_ROOT_HOST=${{ secrets.MYSQL_ROOT_HOST }}
            DATABASE_HOST=${{ secrets.MYSQL_ROOT_HOST }}
            DATABASE_DATABASE=${{ secrets.MYSQL_DATABASE }}
            DATABASE_USERNAME=${{ secrets.MYSQL_USER }}
            DATABASE_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            API_BACKEND=${{ secrets.API_BACKEND }}
            API_FRONTEND=${{ secrets.API_FRONTEND }}
            UPLOAD_DIR_PHOTOS=${{ secrets.UPLOAD_DIR_PHOTOS }}
            UPLOAD_DIR_PHOTOS_USERS=${{ secrets.UPLOAD_DIR_PHOTOS_USERS }}
            EOF

      - name: Copiar docker-compose.yml para o servidor
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          source: "docker-compose.yml"
          target: "/almeidas"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        timeout-minutes: 60
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          script: |
            cd /almeidas
            docker-compose pull
            docker-compose down
            docker-compose up -d
            docker image prune -af